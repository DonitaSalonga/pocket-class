name: Project2
options:
  bundleIdPrefix: com.donita.project2
  deploymentTarget:
    iOS: "18.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Project2:
    type: application
    platform: iOS
    # DebugSamples are two tiny real files used by the DEBUG `-debugUploadSamples` launch argument; Release leaves them out.
    sources: [App/Sources, App/DebugSamples]
    settings:
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: sample.pdf sample.pptx
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.donita.project2
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: Supabase
  Project2Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/Tests]
    dependencies:
      - target: Project2
      - package: Supabase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.donita.project2.tests
  Project2IntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/IntegrationTests]
    dependencies:
      - target: Project2
      - package: Supabase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.donita.project2.integration-tests
schemes:
  Project2:
    build:
      targets:
        Project2: all
        Project2Tests: [test]
    test:
      targets:
        - Project2Tests
  Project2Integration:
    build:
      targets:
        Project2: all
        Project2IntegrationTests: [test]
    test:
      targets:
        - Project2IntegrationTests
